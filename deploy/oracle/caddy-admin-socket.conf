# systemd drop-in for caddy.service. setup-server.sh installs this file as
# /etc/systemd/system/caddy.service.d/beastie-admin-socket.conf.
#
# Caddy's admin API can change Caddy's whole configuration and has no password. Caddyfile.template
# puts it on the unix socket /run/caddy/admin.sock instead of the default localhost:2019, which
# every local process can reach, the site included. systemd creates /run/caddy each time Caddy
# starts, owned by the caddy user and closed to other users (mode 0750, and the site's user is not
# in the caddy group). "systemctl reload caddy" still works: it runs "caddy reload" as the caddy
# user, which reads the socket path from the Caddyfile.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
