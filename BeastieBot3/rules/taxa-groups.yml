  insects:
    name: "Insects"
    adjective: "insect"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Insecta
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    children: [odonata, lepidoptera]

  # Orders of insects with their own least concern and data deficient lists.
  odonata:
    name: "Dragonflies and damselflies"
    adjective: "dragonfly and damselfly"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Insecta
      - rank: order
        value: Odonata

  lepidoptera:
    name: "Butterflies and moths"
    adjective: "butterfly and moth"
    display:
