    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Actinopterygii
      - rank: order
        value: Cyprinodontiformes

  gobiiformes:
    name: "Gobiiform fishes"
    adjective: "gobiiform fish"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Actinopterygii
      - rank: order
        value: Gobiiformes

  ophidiiformes:
