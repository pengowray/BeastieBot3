# Taxonomic group definitions for Wikipedia list generation.
# Each group defines the filters needed to select taxa from the IUCN database.
# Reference these by name in wikipedia-lists.yml using "taxa_group: <name>"
#
# Listing styles (display.listing_style):
# - CommonNameFocus (default): [[Common name]] (''Scientific name'') (e.g. for reptiles)
# - ScientificNameFocus: ''[[Scientific name]]'', Common name (for plants/invertebrates)
# - CommonNameOnly: [[Common name]] (for mammals, birds, sharks+rays) -- Scientific name (italicized) displayed when common name is missing.
# notes: Link points to the taxon page if known, otherwise redlink to scientific name from IUCN assessment.

groups:
  # ==================== ANIMALIA - VERTEBRATES ====================
  amphibians:
    name: "Amphibians"
    adjective: "amphibian"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of amphibians"
      conservation: "Amphibian conservation"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Amphibia
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    children: [frogs]

  # Sub-group of amphibians: least concern frogs are most of the least concern amphibians.
  frogs:
    name: "Frogs"
    adjective: "frog"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of amphibians"
      conservation: "Amphibian conservation"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Amphibia
      - rank: order
        value: Anura

  birds:
    name: "Birds"
    adjective: "bird"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of birds"
      conservation: "Bird conservation"
    display:
      listing_style: CommonNameOnly  # All birds have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Aves
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    children: [passerines]

  # Sub-group of birds: passerines are about two thirds of the least concern birds.
  passerines:
    name: "Passerines"
    adjective: "passerine"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of birds"
      conservation: "Bird conservation"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Aves
      - rank: order
        value: Passeriformes

  reptiles:
    name: "Reptiles"
    adjective: "reptile"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of reptiles"
      conservation: "Reptile conservation"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Reptilia

  mammals:
    name: "Mammals"
    adjective: "mammalian"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of mammals"
      conservation: "Mammal conservation"
    display:
      listing_style: CommonNameOnly  # All mammals have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia

  bats:
    name: "Bats"
    adjective: "bat"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - rank: order
        value: Chiroptera

  rodents:
    name: "Rodents"
    adjective: "rodent"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - rank: order
        value: Rodentia

  primates:
    name: "Primates"
    adjective: "primate"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - rank: order
        value: Primates

  # Marine mammals (paraphyletic): Cetaceans, Sirenians, Pinnipeds, Sea Otters, Polar Bears
  # Uses IUCN's "Marine" system tag for accurate filtering
  marine-mammals:
    name: "Marine mammals"
    adjective: "marine mammal"
    display:
      listing_style: CommonNameOnly  # All marine mammals have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - system: Marine
    # Custom grouping for display: organize by biological group, not order
    custom_groups:
      - name: Cetaceans
        common_name: cetacean
        common_plural: cetaceans
        main_article: Cetacea
        families:
          - BALAENIDAE
          - BALAENOPTERIDAE
          - DELPHINIDAE
          - ESCHRICHTIIDAE
          - INIIDAE
          - KOGIIDAE
          - LIPOTIDAE
          - MONODONTIDAE
          - NEOBALAENIDAE
          - PHOCOENIDAE
          - PHYSETERIDAE
          - PLATANISTIDAE
          - PONTOPORIIDAE
          - ZIPHIIDAE
      - name: Sirenians
        common_name: sirenian
        common_plural: sirenians
        main_article: Sirenia
        families:
          - DUGONGIDAE
          - TRICHECHIDAE
      - name: Pinnipeds
        common_name: pinniped
        common_plural: pinnipeds
        main_article: Pinniped
        families:
          - OTARIIDAE
          - PHOCIDAE
          - ODOBENIDAE
      - name: Other marine mammals
        common_plural: other marine mammals
        main_article: Marine mammal
        default: true
        # Catches sea otters (Mustelidae) and polar bear (Ursidae)

  ray-finned-fishes:
    name: "Ray-finned fishes"
    adjective: "ray-finned fish"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Actinopterygii
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    children: [anguilliformes, characiformes, cichliformes, cypriniformes, cyprinodontiformes, gobiiformes, ophidiiformes, perciformes, pleuronectiformes, scorpaeniformes, siluriformes, stomiiformes, tetraodontiformes]

  # Orders of ray-finned fishes with their own least concern and data deficient lists: the largest
  # orders, chosen so the rest of each list fits on the ray-finned fishes page (under about 3,300
  # entries). Named by the order's English name where the whole order has one (eels, catfishes,
  # flatfishes, toothcarps), otherwise "<order adjective> fishes" as in the existing en-wiki article
  # "List of least concern perciform fishes".
  anguilliformes:
    name: "Eels"
    adjective: "eel"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Actinopterygii
      - rank: order
        value: Anguilliformes

  characiformes:
    name: "Characiform fishes"
    adjective: "characiform fish"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Actinopterygii
      - rank: order
        value: Characiformes

  cichliformes:
