# Taxonomic group definitions for Wikipedia list generation.
# Each group defines the filters needed to select taxa from the IUCN database.
# Reference these by name in wikipedia-lists.yml using "taxa_group: <name>"
#
# Listing styles (display.listing_style):
# - CommonNameFocus (default): [[Common name]] (''Scientific name'') (e.g. for reptiles)
# - ScientificNameFocus: ''[[Scientific name]]'', Common name (for plants/invertebrates)
# - CommonNameOnly: [[Common name]] (for mammals, birds, sharks+rays) -- Scientific name (italicized) displayed when common name is missing.
# notes: Link points to the taxon page if known, otherwise redlink to scientific name from IUCN assessment.
#
# sub_groups: splits a group's pages by one rank (see magnoliopsida). Each entry under groups: becomes a
# group with the parent's filters plus "<rank>: <value>", the parent's display, categories and
# size_budget, a list for each of the presets (placed after the parent's entry in wikipedia-lists.yml),
# and a place in the parent's children. Its id is the value in lower case (e.g. malpighiales); its name
# defaults to the value and its adjective to the name. keep_name_case keeps the capital letters of a
# scientific name in titles and file names ("List of threatened Malpighiales").

groups:
  # ==================== ANIMALIA - VERTEBRATES ====================
  amphibians:
    name: "Amphibians"
    adjective: "amphibian"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of amphibians"
      conservation: "Amphibian conservation"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Amphibia
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    # Frogs are most of the least concern amphibians.
    sub_groups:
      rank: order
      presets: [lc]
      groups:
        Anura: { name: "Frogs", adjective: "frog" }

  birds:
    name: "Birds"
    adjective: "bird"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of birds"
      conservation: "Bird conservation"
    display:
      listing_style: CommonNameOnly  # All birds have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Aves
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    # Passerines are about two thirds of the least concern birds.
    sub_groups:
      rank: order
      presets: [lc]
      groups:
        Passeriformes: { name: "Passerines", adjective: "passerine" }

  reptiles:
    name: "Reptiles"
    adjective: "reptile"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of reptiles"
      conservation: "Reptile conservation"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Reptilia

  mammals:
    name: "Mammals"
    adjective: "mammalian"
    categories:
      kingdom_list: "Lists of animals by conservation status"
      list: "Lists of mammals"
      conservation: "Mammal conservation"
    display:
      listing_style: CommonNameOnly  # All mammals have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia

  bats:
    name: "Bats"
    adjective: "bat"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - rank: order
        value: Chiroptera

  rodents:
    name: "Rodents"
    adjective: "rodent"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - rank: order
        value: Rodentia

  primates:
    name: "Primates"
    adjective: "primate"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - rank: order
        value: Primates

  # Marine mammals (paraphyletic): Cetaceans, Sirenians, Pinnipeds, Sea Otters, Polar Bears
  # Uses IUCN's "Marine" system tag for accurate filtering
  marine-mammals:
    name: "Marine mammals"
    adjective: "marine mammal"
    display:
      listing_style: CommonNameOnly  # All marine mammals have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
      - system: Marine
    # Custom grouping for display: organize by biological group, not order
    custom_groups:
      - name: Cetaceans
        common_name: cetacean
        common_plural: cetaceans
        main_article: Cetacea
        families:
          - BALAENIDAE
          - BALAENOPTERIDAE
          - DELPHINIDAE
          - ESCHRICHTIIDAE
          - INIIDAE
          - KOGIIDAE
          - LIPOTIDAE
          - MONODONTIDAE
          - NEOBALAENIDAE
          - PHOCOENIDAE
          - PHYSETERIDAE
          - PLATANISTIDAE
          - PONTOPORIIDAE
          - ZIPHIIDAE
      - name: Sirenians
        common_name: sirenian
        common_plural: sirenians
        main_article: Sirenia
        families:
          - DUGONGIDAE
          - TRICHECHIDAE
      - name: Pinnipeds
        common_name: pinniped
        common_plural: pinnipeds
        main_article: Pinniped
        families:
          - OTARIIDAE
          - PHOCIDAE
          - ODOBENIDAE
      - name: Other marine mammals
        common_plural: other marine mammals
        main_article: Marine mammal
        default: true
        # Catches sea otters (Mustelidae) and polar bear (Ursidae)

  ray-finned-fishes:
    name: "Ray-finned fishes"
    adjective: "ray-finned fish"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Actinopterygii
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    # The largest orders get their own least concern and data deficient lists, so the rest of each
    # list fits on the ray-finned fishes page, under about 3,300 entries. No threatened lists: some of
    # these orders have no threatened species. Named by the English name where the whole order has
    # one, otherwise "<adjective> fishes" as in the en-wiki article "List of least concern perciform fishes".
    sub_groups:
      rank: order
      presets: [lc, dd]
      groups:
        Anguilliformes: { name: "Eels", adjective: "eel" }
        Characiformes: { name: "Characiform fishes", adjective: "characiform fish" }
        Cichliformes: { name: "Cichliform fishes", adjective: "cichliform fish" }
        Cypriniformes: { name: "Cypriniform fishes", adjective: "cypriniform fish" }
        Cyprinodontiformes: { name: "Toothcarps", adjective: "toothcarp" }
        Gobiiformes: { name: "Gobiiform fishes", adjective: "gobiiform fish" }
        Ophidiiformes: { name: "Ophidiiform fishes", adjective: "ophidiiform fish" }
        Perciformes: { name: "Perciform fishes", adjective: "perciform fish" }
        Pleuronectiformes: { name: "Flatfishes", adjective: "flatfish" }
        Scorpaeniformes: { name: "Scorpaeniform fishes", adjective: "scorpaeniform fish" }
        Siluriformes: { name: "Catfishes", adjective: "catfish" }
        Stomiiformes: { name: "Stomiiform fishes", adjective: "stomiiform fish" }
        Tetraodontiformes: { name: "Tetraodontiform fishes", adjective: "tetraodontiform fish" }

  sharks-rays:
    name: "Sharks and rays"
    adjective: "shark and ray"
    display:
      listing_style: CommonNameOnly  # Sharks/rays have common names
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Chondrichthyes

  # ==================== ANIMALIA - INVERTEBRATES ====================
  # Note: Invertebrates typically use ScientificNameFocus because common names are sparse/unreliable
  insects:
    name: "Insects"
    adjective: "insect"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Insecta
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    # The two largest orders get their own least concern and data deficient lists.
    sub_groups:
      rank: order
      presets: [lc, dd]
      groups:
        Odonata: { name: "Dragonflies and damselflies", adjective: "dragonfly and damselfly" }
        Lepidoptera: { name: "Butterflies and moths", adjective: "butterfly and moth" }

  gastropods:
    name: "Gastropods"
    adjective: "gastropod"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Gastropoda

  bivalves:
    name: "Bivalves"
    adjective: "bivalve"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Bivalvia

  crustaceans:
    name: "Crustaceans"
    adjective: "crustacean"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Malacostraca

  corals:
    name: "Corals"
    adjective: "coral"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Anthozoa

  arachnids:
    name: "Arachnids"
    adjective: "arachnid"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Arachnida

  # ==================== VIRTUAL PARENTS (nested lists) ====================
  # Parent groups aggregate several leaf groups: they render a per-child summary table + bare-bones
  # sections + links DOWN to the child lists, instead of a flat species body. See docs/wikipedia-list-formatting.md.
  # A parent list links each child's list for the same preset; a child with no such list but an
  # all-status list is linked to that instead, on a page that links at least one other child list.
  # generate-lists prints a warning for each child a parent page cannot link.

  # Invertebrates = all animals except chordates (true paraphyly → needs the exclude filter).
  invertebrates:
    name: "Invertebrates"
    adjective: "invertebrate"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: phylum
        exclude: [Chordata]
    children: [insects, gastropods, bivalves, crustaceans, corals, arachnids]

  # Fish = the five fish classes (no single Linnaean class). Multi-class include, no exclude needed.
  fish:
    name: "Fish"
    adjective: "fish"
    display:
      listing_style: CommonNameOnly
    filters:
      - rank: class
        values: [Actinopterygii, Chondrichthyes, Myxini, Petromyzonti, Sarcopterygii]
    children: [ray-finned-fishes, sharks-rays]

  # ==================== ANIMALIA - KINGDOM LEVEL ====================
  animals:
    name: "Animals"
    adjective: "animal"
    filters:
      - rank: kingdom
        value: Animalia

  # ==================== PLANTAE ====================
  # Note: Plants use ScientificNameFocus because common names are sparse/unreliable
  plants:
    name: "Plants"
    adjective: "plant"
    display:
      listing_style: ScientificNameFocus
    # Advisory budget for the impact preview: plant pages this large should be split (taxonomically).
    size_budget:
      max_entries: 5000
    filters:
      - rank: kingdom
        value: Plantae
    # Parent breakouts: the threatened/lc plant pages link DOWN to the dicot/monocot sub-lists. Conifers
    # and cycads have one all-status page each, which those two pages link in place of a threatened/lc
    # list. plants-nt/dd/extinct-combined stay ordinary lists: no sub-group has a list for those
    # presets, and an all-status list alone does not make a page a parent.
    # bryopsida is not a sub-group here. Its name is "Mosses" but it covers class Bryopsida only, so a
    # "Mosses" section on these pages would give a wrong moss count: 96 of the 112 threatened mosses in
    # 2026-1. Sphagnopsida, Andreaeopsida, Takakiopsida and Polytrichopsida are moss classes too. A
    # sub-group must be a single class (the summary table and the sections match children by one class
    # value), so Bryopsida stays an ordinary class section on the plants pages.
    children: [magnoliopsida, liliopsida, conifers, cycads]

  # Flowering plants split into the two big classes so the huge threatened list can break out by class.
  magnoliopsida:
    name: "Dicotyledons"
    adjective: "dicot"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: MAGNOLIOPSIDA
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    # The largest orders get their own threatened and least concern lists, so the rest of each
    # dicotyledons list (the other 39 orders) fits on that page, under about 3,300 entries.
    sub_groups:
      rank: order
      presets: [threatened, lc]
      keep_name_case: true
      groups:
        Apiales: {}
        Asterales: {}
        Caryophyllales: {}
        Ericales: {}
        Fabales: {}
        Fagales: {}
        Gentianales: {}
        Lamiales: {}
        Laurales: {}
        Magnoliales: {}
        Malpighiales: {}
        Malvales: {}
        Myrtales: {}
        Proteales: {}
        Rosales: {}
        Sapindales: {}

  liliopsida:
    name: "Monocotyledons"
    adjective: "monocot"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: LILIOPSIDA
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    # The two largest orders get their own threatened and least concern lists.
    sub_groups:
      rank: order
      presets: [threatened, lc]
      keep_name_case: true
      groups:
        Asparagales: {}
        Poales: {}

  bryopsida:
    name: "Mosses"
    adjective: "moss"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: BRYOPSIDA

  conifers:
    name: "Conifers"
    adjective: "conifer"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: Pinopsida

  cycads:
    name: "Cycads"
    adjective: "cycad"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: Cycadopsida

  # ==================== OTHER KINGDOMS ====================
  fungi:
    name: "Fungi"
    adjective: "fungus"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Fungi

  chromista:
    name: "Chromista"
    adjective: "chromist"
    keep_name_case: true  # a kingdom name with no common English form: "List of Chromista by conservation status"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Chromista
