        value: Lamiales

  laurales:
    name: "Laurales"
    keep_name_case: true
    adjective: "Laurales"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: Magnoliopsida
      - rank: order
        value: Laurales

  magnoliales:
    name: "Magnoliales"
    keep_name_case: true
    adjective: "Magnoliales"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: Magnoliopsida
      - rank: order
        value: Magnoliales

  malpighiales:
    name: "Malpighiales"
    keep_name_case: true
    adjective: "Malpighiales"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: Magnoliopsida
      - rank: order
        value: Malpighiales

  malvales:
