      - rank: class
        value: LILIOPSIDA
    # Pages over about 3,600 entries go over Wikipedia's template expansion limit.
    size_budget:
      max_entries: 3600
    children: [asparagales, poales]

  # Orders of monocots with their own threatened and least concern lists.
  asparagales:
    name: "Asparagales"
    keep_name_case: true
    adjective: "Asparagales"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
        value: Liliopsida
      - rank: order
        value: Asparagales

  poales:
    name: "Poales"
    keep_name_case: true
    adjective: "Poales"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Plantae
      - rank: class
