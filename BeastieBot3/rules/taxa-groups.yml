    adjective: "gastropod"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Gastropoda

  bivalves:
    name: "Bivalves"
    adjective: "bivalve"
    display:
      listing_style: ScientificNameFocus
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Bivalvia

  crustaceans:
