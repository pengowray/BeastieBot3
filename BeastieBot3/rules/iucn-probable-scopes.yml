# Probable scopes of the assessments IUCN published with no geographic scope.
#
# Every other IUCN assessment has a scope: Global, or a region such as Europe or the Persian Gulf.
# These have none (an empty scopes array in the API, an empty scopes column in the CSV export). Their
# citations, assessors and locations show where they were made, so this file gives each one the
# scope it most likely has. They are this site's guesses, checked by hand; IUCN has not said so.
#
# site build-db copies them into the site database (table probable_scope), and the taxon page shows
# the guess under "No scope given". The audit site's "Assessments with no geographic scope" page
# lists them too. The build warns about an assessment with no scope that is not in this file (new
# ones appear with each release) and about an entry whose assessment now has a scope.
#
# Each group: the probable scope; kind national (one country) or regional (several countries, or a
# region IUCN uses as a scope); the evidence, shown on the site, in this site's own words (never
# IUCN's narrative text); and the assessments, by IUCN assessment id. The name after each id is for
# the reader of this file; the build warns when it is not the taxon's name.
#
# Checked against release 2026-1 (10 October 2026): 52 assessments with no scope in the IUCN API
# cache, 33 of them on the site. The other 19 have no year published (unpublished drafts, which the
# site leaves out); they are listed for the audit site and marked "unpublished".
#
# Not guessed: 205907654 Haplochromis niloticus (unpublished, category N/A, assessor Kaufman, L.,
# Uganda the only location).

scopes:
  - scope: United Arab Emirates
    kind: national
    evidence: The citation credits the UAE National Red List Workshop.
    assessments:
