# One-time, human/LLM-written commentary for the unofficial Red List audit site.
#
# Each entry is pinned to a report id and a release. The generator shows an entry only when its
# release matches the release being built (or when release is "any"). This keeps interpretive prose
# written once for a specific release separate from the release-agnostic notes generated in code.
#
# Fields:
#   report   the report id (failed-assessments, empty-scope, taxonomy-cleanup, synonym-whitespace,
#            synonym-markup, synonym-name-notes, common-name-issues, orphan-infraranks, no-latest,
#            html-consistency, taxonomy-consistency, field-hygiene, name-changes; the Catalogue of
#            Life crosscheck pages col-close-match, col-other-name, col-via-wiki, col-synonym,
#            col-synonym-higher, col-classification, col-authority, col-accepted-differs, col-reorg,
#            col-not-found; "index" for the note above the Start here list on the front page; and
#            "col-crosscheck" for the crosscheck's own entry page)
#   release  "2025-2" for this release only, or "any" to carry forward to later releases
#   scope    "report" (shown on the report page) or "finding" (matched to a row by key)
#   key      required for scope: finding; the AuditFinding.Key, usually "{taxonId}:{issueType}"
#   title    optional heading shown above the note
#   markdown the note text (small markdown subset: paragraphs, **bold**, *italic*, `code`,
#            [text](url), - lists, > quote, ## / ### headings)
#
# Examples are left commented out. Add observations here as they are confirmed by hand.

# - report: failed-assessments
#   release: 2025-2
#   scope: report
#   title: About this set
#   markdown: |
#     Every record here shares one trait: an empty geographic-scope array. Each affected taxon
#     also has a valid scoped assessment, so coverage is unaffected.

- report: empty-scope
  release: 2026-1
  scope: report
  title: Changes since 2025-2
  markdown: |
    Release 2025-2 had 23 of these records; 2026-1 has 52, so new ones are still being created.
    Several of the new ones have scientific names ending in `_new`, which suggests draft records
    that reached the published dataset.

    Until late August 2026 the API returned HTTP 500 (Internal Server Error) for every one of these
    assessments. Between 24 August and 1 September 2026 the API began serving them normally. The
    scope field is still blank, so the records still drop out of any scoped search, including the
    usual "Global" filter; they remain reachable through the API and by direct link.

- report: index
  release: 2026-1
  scope: report
  markdown: |
    Compared with 2025-2, the blank-scope list more than doubled and the whitespace list is
    unchanged. The Catalogue of Life crosscheck is on its own page; it records where two catalogues
    disagree, not errors in either.

- report: failed-assessments
  release: 2026-1
  scope: report
  title: Changes since 2025-2
  markdown: |
    Blank-scope assessments, which the API previously answered with an HTTP 500 Error, were 
    planned to be listed on this page also, however the API now serves them, so they have moved to
    [Assessments with no geographic scope](empty-scope.html).

- report: no-latest
  release: 2026-1
  scope: report
  title: Change since 2025-2
  markdown: |
    In release 2025-2 this list held 3,898 taxa; in 2026-1 it holds 4,218 (up 320). Both figures
    are minimums, covering the taxa retrieved from the API at the time.

- report: orphan-infraranks
  release: 2026-1
  scope: report
  title: Change since 2025-2
  markdown: |
    Down from 383 in release 2025-2 to 358 in 2026-1.

- report: taxonomy-consistency
  release: 2026-1
  scope: report
  title: About the four rows
  markdown: |
    All four rows come from one typo: two sea snake species whose scientificName is written
    *MIcrocephalophis* (extra capital I) while the genus field correctly reads
    *Microcephalophis*. The same typo is present in release 2025-2.

- report: taxonomy-cleanup
  release: 2026-1
  scope: report
  title: Change since 2025-2
  markdown: |
    Essentially unchanged from release 2025-2 (1,095 rows then, 1,099 now).

- report: synonym-whitespace
  release: 2026-1
  scope: report
  title: Change since 2025-2
  markdown: |
    Release 2025-2 had 11,578 rows; 2026-1 has slightly more. The earlier observations remain in
    the data, with new ones added alongside.
