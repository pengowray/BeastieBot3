# Settings for `wikidata iucn-status-plan`, the dry run that plans IUCN conservation status (P141)
# updates on Wikidata taxon items. Each id here was checked on Wikidata on 2026-09-13.
# Leave an id empty until the item exists: the plan then writes a CREATE: placeholder instead.

release: 2026-1

# "The IUCN Red List of Threatened Species 2026.1" edition item. Does not exist yet.
# Model it on 2025.2 (Q136547248): P31 Q3331189, P629 Q32059, P1476, P577, P155 Q136547248, P407 Q1860.
edition_item:

red_list_item: Q32059          # IUCN Red List

# Rank variants recorded for a changed status:
#   preferred: new preferred statement, earlier ones kept at normal rank (MatSuBot, Nov 2025)
#   replace:   value and references overwritten in place (SuccuBot, 2013-2023)
rank_variants: [preferred, replace]

# Add the assessment page URL (which carries the assessment id) to the release reference,
# until Wikidata has a property for the IUCN assessment id.
reference_assessment_url: true

edit_summary: "IUCN Red List {release}: conservation status {code} (IUCN taxon {taxon_id}, assessment {assessment_id})"

# A new item for an assessment publication, used when Wikidata has none for that assessment.
# The class, label and title language are part of the modelling proposal and not settled.
assessment_item:
  instance_of: Q13442814       # scholarly article, like most of the ~5,000 existing assessment items
  label: "{name}. The IUCN Red List of Threatened Species {year}: e.T{taxon_id}A{assessment_id}"
  description: "IUCN Red List assessment of {name}"
  title_language: en
  publisher: Q48268            # International Union for Conservation of Nature
  language: Q1860              # English
  author_credit_types: [assessor]
