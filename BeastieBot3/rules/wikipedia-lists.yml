# Wikipedia list definitions for the new generator.
# This file references taxa-groups.yml and list-presets.yml for a cleaner, more maintainable structure.
#
# Syntax options:
# 1. Compact multi-preset: taxa_group + presets array → generates one list per preset
# 2. Single preset: taxa_group + preset → generates one list
# 3. Full definition: specify all fields explicitly (for custom lists)
#
# A taxa group's sub_groups block (taxa-groups.yml) adds its sub-groups' list entries here when the
# file is loaded, after the group's own entry. They are not written in this file.

defaults:
  header_template: status-default
  footer_template: references-default
  grouping:
    - level: order
      label: "Order"
      always_display: false
      unknown_label: "Other orders"
    - level: family
      label: "Family"
      always_display: false
      unknown_label: "Unassigned families"
      min_items: 5
      min_groups_for_other: 3
      show_rank_label: true  # Show "Family [[Familyidae]]" format
  auto_split:
    threshold: 30              # Split groups with >= 30 species into finer taxonomy headings
    min_group_size: 10         # All meaningful groups must have >= this many species (one exception when 4+ groups)
    min_items_per_group: 3     # Groups with fewer items get lumped into "Other {rank}"
    max_other_fraction: 0.6    # Reject split if >60% of items end up in Other/Unknown groups
    max_groups: 15             # Reject split if it produces more than 15 groups after lumping
    max_depth: 1               # Maximum auto-split nesting levels (prevents heading depth violations)
    min_meaningful_groups: 3   # Need at least 3 real (non-Other/Unknown) groups to accept a split
    reject_unknown_groups: true # Reject any split that produces "Unknown X" headings
    max_dominance: 0.85        # Reject a split where one group holds more than 85% of the species; try the next rank
  # Headings from Catalogue of Life nodes between two grouping levels, such as suborder Serpentes
  # between order Squamata and the snake families. Shown only when every gate passes. A list can
  # set its own intermediate_groups: (or auto_split:) block, which replaces this one.
  intermediate_groups:
    enabled: true
    min_items: 30              # The parent heading holds at least 30 species
    min_anchors: 6             # ...in at least 6 groups of the level below (e.g. 6 families)
    max_groups: 15             # At most 15 CoL groups
    max_dominance: 0.9         # No CoL group holds more than 90% of the species
    min_group_size: 5          # At least one CoL group has 5 or more species, and 5 or more are outside the largest
    look_through_dominant: true # When one CoL group is over max_dominance, try the CoL groups inside it
    max_layers: 1              # At most one level of CoL headings between two grouping levels
    max_heading_share: 0.8     # The CoL groups must leave at most 80% as many headings as the level below has
  display:
    prefer_common_names: true
    italicize_scientific: true
    include_status_template: true
    include_status_label: true
    include_family_in_other_bucket: true  # Annotate species in "Other" buckets with family
    group_subspecies: true  # Group subspecies under their parent species
    separate_infraspecific_sections: true  # Separate subspecies/varieties/subpopulations into own sections

lists:
  # ==================== MAMMALS ====================
  - taxa_group: mammals
    presets: [threatened, cr, en, vu, nt, dd, lc, ew, ex]

  # ==================== AMPHIBIANS ====================
  - taxa_group: amphibians
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]
    templates:
      header: amphibians-status

  # ==================== BIRDS ====================
  - taxa_group: birds
    presets: [threatened, cr, en, vu, nt, dd, lc, ew, ex]

  # ==================== REPTILES ====================
  - taxa_group: reptiles
    presets: [threatened, cr, en, vu, nt, dd, lc, ew, ex]

  # ==================== MARINE MAMMALS (paraphyletic) ====================
  - taxa_group: marine-mammals
    presets: [threatened, cr, en, vu, nt, dd, lc, ew, ex, all-status]

  # ==================== RAY-FINNED FISHES ====================
  - taxa_group: ray-finned-fishes
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== SHARKS & RAYS ====================
  - taxa_group: sharks-rays
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== INSECTS ====================
  - taxa_group: insects
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== GASTROPODS ====================
  - taxa_group: gastropods
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== BIVALVES ====================
  - taxa_group: bivalves
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== CRUSTACEANS ====================
  - taxa_group: crustaceans
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== CORALS ====================
  - taxa_group: corals
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== ARACHNIDS ====================
  - taxa_group: arachnids
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== INVERTEBRATES (parent — nests insects, gastropods, ...) ====================
  # Keep these presets a subset of every child's presets, so each {child}-{preset} link resolves.
  # A child with no list for a preset but an all-status list is linked to its all-status list; a
  # child with neither is left unlinked, and generate-lists prints a warning for it.
  - taxa_group: invertebrates
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== FISH (parent — nests ray-finned + sharks/rays) ====================
  - taxa_group: fish
    presets: [threatened, cr, en, vu, nt, dd, lc, ex]

  # ==================== PLANTS (parent: merged top-level + per-class breakouts) ====================
  # merged -> extinct-combined, threatened, nt, dd, lc (CR/EN/VU never split; EX/EW/PE/PEW on one page).
  # plants-threatened / plants-lc become parent pages that break out the dicot/monocot sub-lists, and
  # link the conifer and cycad all-status pages below. nt/dd/extinct-combined stay ordinary lists.
  # bryopsida is not a sub-group of plants (it covers class Bryopsida only, not all mosses; see
  # taxa-groups.yml), so the plants pages list Bryopsida species in their own class section.
  - taxa_group: plants
    category_split: merged
  - taxa_group: magnoliopsida
    presets: [threatened, lc]
  - taxa_group: liliopsida
    presets: [threatened, lc]
  - taxa_group: bryopsida
    category_split: all-status

  # ==================== CONIFERS / CYCADS (complete-by-status pages) ====================
  - taxa_group: conifers
    category_split: all-status

  - taxa_group: cycads
    category_split: all-status

  # ==================== CHROMISTA ====================
  - taxa_group: chromista
    presets: [all-status]

  # ==================== FUNGI ====================
  - taxa_group: fungi
    presets: [threatened, cr, en, vu, ex, all-status]

  # ==================== SPECIAL CROSS-TAXA LISTS ====================
  # These don't fit the taxa_group + preset pattern, so are defined explicitly

  - id: ew-animals
    title: "List of animals that are extinct in the wild"
    description: "Animal taxa assessed by the IUCN as extinct in the wild."
    output_file: "List_of_animals_that_are_extinct_in_the_wild.wikitext"
    filters:
      - rank: kingdom
        value: Animalia
    sections:
      - key: extinct-in-the-wild
        heading: "Extinct in the wild"
        statuses:
          - code: EW
          - code: "CR(PEW)"
            label: "Possibly extinct in the wild"

  - id: ew-plants
    title: "List of plants that are extinct in the wild"
    description: "Plant taxa assessed by the IUCN as extinct in the wild."
    output_file: "List_of_plants_that_are_extinct_in_the_wild.wikitext"
    filters:
      - rank: kingdom
        value: Plantae
    sections:
      - key: extinct-in-the-wild
        heading: "Extinct in the wild"
        statuses:
          - code: EW
          - code: "CR(PEW)"
            label: "Possibly extinct in the wild"

  - id: lr-cd
    title: "IUCN Red List conservation dependent species"
    description: "Legacy LR/cd assessments across every kingdom."
    output_file: "IUCN_Red_List_conservation_dependent_species.wikitext"
    templates:
      header: legacy-status-note
    sections:
      - key: conservation-dependent
        heading: "Conservation dependent"
        statuses:
          - code: "LR/cd"
  # ==================== TEST: COL ENRICHED GROUPING ====================
  # This tests the COL-based taxonomy enrichment with superfamily-level grouping
  - id: test-reptiles-ex-enriched
    title: "Test: Extinct reptiles with COL superfamily grouping"
    description: "Testing COL taxonomy enrichment for finer-grained grouping."
    output_file: "Test_extinct_reptiles_col_enriched.wikitext"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Reptilia
    sections:
      - key: extinct
        heading: "Extinct species"
        statuses:
          - code: EX
    grouping:
      - level: order
        label: "Order"
        always_display: false
        unknown_label: "Other orders"
      - level: superfamily
        label: "Superfamily"
        always_display: false
        unknown_label: "Other superfamilies"
      - level: family
        label: "Family"
        always_display: false
        unknown_label: "Unassigned families"
  # ==================== TEST: MIN_ITEMS / OTHER GROUPING ====================
  # Tests merging small family groups into "Other families"
  - id: test-mammals-ex-minitems
    title: "Test: Extinct mammals with min_items grouping"
    description: "Testing min_items to merge small families into Other."
    output_file: "Test_extinct_mammals_minitems.wikitext"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
    sections:
      - key: extinct
        heading: "Extinct species"
        statuses:
          - code: EX
    grouping:
      - level: order
        label: "Order"
        always_display: false
        unknown_label: "Other orders"
      - level: family
        label: "Family"
        always_display: false
        unknown_label: "Unassigned families"
        min_items: 3
        other_label: "Other families"

  # ==================== TEST: SUBSPECIES GROUPING ====================
  # Tests grouping subspecies under their parent species
  - id: test-mammals-ex-subspecies
    title: "Test: Extinct mammals with subspecies grouping"
    description: "Testing subspecies grouping under parent species."
    output_file: "Test_extinct_mammals_subspecies.wikitext"
    filters:
      - rank: kingdom
        value: Animalia
      - rank: class
        value: Mammalia
    sections:
      - key: extinct
        heading: "Extinct species and subspecies"
        statuses:
          - code: EX
    grouping:
      - level: order
        label: "Order"
        always_display: false
        unknown_label: "Other orders"
      - level: family
        label: "Family"
        always_display: false
        unknown_label: "Unassigned families"
    display:
      prefer_common_names: true
      italicize_scientific: true
      include_status_template: true
      include_status_label: true
      group_subspecies: true