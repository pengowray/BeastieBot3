# Scientific names to read as another name: names a seafood guide misspells, and names the site
# would match to the wrong taxon (an IUCN synonym of another species), with the name the guide means. `seafood goodfish-import`
# and `seafood seafoodwatch-import` read this file (SeafoodNames.LoadFixes): a name is matched after
# an abbreviated genus is expanded and the epithets are put in lower case ("K. Peronei" is read as
# "Katelysia peronei"). After editing, import the kept file again with --file.
#
#   guide:  goodfish | seafoodwatch
#   name:   the name as read
#   means:  the name the guide means
#
# Each fix agrees with the common name on the guide's page.
#
# The site matches a name to the taxon with that scientific name, else to the one taxon whose IUCN
# synonyms include it.

fixes:
  - guide: goodfish
    name: Sardinella lemurs
    means: Sardinella lemuru
  - guide: goodfish
    name: Centroberyx affnis
    means: Centroberyx affinis
  - guide: goodfish
    name: Marsupenaeus japonicas
    means: Marsupenaeus japonicus
  - guide: goodfish
    name: Katelysia peronei
    means: Katelysia peronii
  - guide: goodfish
    name: Lutjanus adeti
    means: Lutjanus adetii
  # Australasian snapper. IUCN lists Chrysophrys auratus as a synonym of Sparus aurata (gilthead
  # seabream; Linnaeus's Sparus auratus), and calls the snapper Pagrus auratus.
  - guide: goodfish
    name: Chrysophrys auratus
    means: Pagrus auratus
