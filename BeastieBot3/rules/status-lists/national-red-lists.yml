# National and subnational red lists that `statuses red-lists-import` downloads from GBIF and stores
# in the status lists store, for the "Other conservation statuses" part of the public species site.
#
# Each dataset is a Darwin Core Archive (DwC-A) checklist whose Distribution extension gives a
# category per taxon in threatStatus. A dataset is listed here when:
#   - it is an official or authoritative national or subnational red list, or a legal list of
#     threatened species;
#   - its licence is CC0, CC BY or CC BY-NC (the site is free and non-commercial);
#   - its categories are the list's own, not copies of IUCN global categories;
#   - the publisher has not replaced it with a later full edition (a partial update, such as the
#     2008 update of Luxembourg's bryophyte list, is listed beside the list it updates).
# docs/status-lists.md lists the datasets that were considered and left out, with the reasons.
#
# Fields:
#   key          the dataset's key in the store: <country>-<list>[-<year>], never reused
#   gbif         the GBIF dataset key (https://www.gbif.org/dataset/<key>); the import reads the
#                title, licence, pubDate and archive endpoint from the GBIF registry
#   country      ISO 3166-1 alpha-2 code of the country the list covers
#   region       the part of the country a subnational list covers, with region_code (ISO 3166-2)
#   name         the list's name as its publisher gives it, in the publisher's language
#   name_en      an English name, when name is not in English
#   year         the year of the edition as the publisher gives it; omitted when the dataset holds
#                lists of several years (each row then has its own source and event date)
#   publisher    who published the list (not who put it on GBIF, when they differ)
#   licence      CC0 1.0, CC BY 4.0 or CC BY-NC 4.0; the import refuses a dataset whose licence in
#                the GBIF registry is not one of these
#   citation     the original list, as its archive's metadata (EML) cites it when it does; else
#                the GBIF dataset
#   kingdom      the kingdom to store for taxa when the archive gives none
#   archive_url  use this archive instead of the registry's DWC_ARCHIVE endpoint (the Ecuador IPT
#                does not answer, so its lists come from ChecklistBank's copies)
#   categories   English labels for statuses that are not IUCN categories, or that add to one
#                ("CR*"), keyed by the status as the archive writes it
#   notes        anything the site side or the next person needs to know

datasets:
  - key: se-redlist-2025
    gbif: 87e639cc-30a9-4007-bd2c-b0cab60326b9
    country: SE
    name: Rödlistade arter i Sverige 2025
    name_en: The Swedish Red List 2025
    year: 2025
    publisher: SLU Artdatabanken
    licence: CC0 1.0
    citation: "SLU Artdatabanken (2025). Rödlistade arter i Sverige 2025. Uppsala: SLU Artdatabanken. https://pub.epsilon.slu.se/39759/3/slu-artdatabanken-rodlistan-2025.pdf"
    notes: >-
      Published on 24 March 2026. Only red-listed taxa (RE, CR, EN, VU, NT, DD); taxa assessed LC or
      NA are not in the dataset. Taxon ids are Dyntaxa ids (urn:lsid:dyntaxa.se:Taxon:N; the
      Artfakta page is https://artfakta.se/taxa/N). Synonyms point at their accepted taxon. A few
      unranked rows are populations or seasonal occurrences ("Phocoena phocoena (Baltic
      population)", "Clangula hyemalis (wintering)") and have no canonical name.

  - key: dk-redlist
    gbif: 4b3e4a71-704a-485c-917c-20a89944ea37
    country: DK
    name: Den danske Rødliste
    name_en: The Danish Red List
    publisher: Aarhus University, DCE (Danish Centre for Environment and Energy)
    licence: CC BY 4.0
    citation: "Aarhus University, DCE. The Danish Red List (Den danske Rødliste), redlist.au.dk. Categories as given in: Skipper L., Calabuig I. & The Danish Agency for Green Land Use and Aquatic Environment (2026). National Checklist of all species occurring in Denmark. https://doi.org/10.15468/bpmaze"
    notes: >-
      The statuses come from the national checklist behind arter.dk (the Danish agency's species
      portal), which gives every taxon the Danish Red List category it has now; the archive does
      not name the edition, so there is no year. The archive is rebuilt every night, so the import
      only downloads it again when GBIF's pubDate changes. Taxon pages are the references URLs
      (https://arter.dk//taxa/N). The distribution source column names where the occurrence
      record came from, not the red list.

