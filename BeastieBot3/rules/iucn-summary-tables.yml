# IUCN's summary statistics tables that `iucn summary-tables` downloads and reads.
#
# Table 7, "Species changing IUCN Red List Status", lists every species whose category changed since
# the last release of the year before, with the reason for each change: G (genuine change in the
# species' status), N (non-genuine change: new information, taxonomy, criteria, ...) or E (the
# previous listing was an error, from 2014). The IUCN Red List API and CSV export do not have the
# reason, so these tables are its only public source. Each release's table includes the changes of
# the earlier releases of the same year; when two tables give one change different reasons, the
# table later in this file is used.
#
# Table 9, "Possibly Extinct and Possibly Extinct in the Wild Species" (2014-1 to 2020-2), lists every
# Critically Endangered species tagged Possibly Extinct (PE) or Possibly Extinct in the Wild (PEW),
# the year of its first such assessment, and the date last recorded in the wild.
#
# IUCN's summary statistics page (https://www.iucnredlist.org/resources/summary-statistics) links the
# current Table 7 and a zip of the end-of-year Table 7s from 2007. The other files were found through
# the Internet Archive's list of files on IUCN's servers; files that IUCN no longer serves have an
# archive_url, which is used when url does not return a PDF.
#
# The command also tries the file names IUCN has used for the releases after the last Table 7 here
# ("2026-2_RL_Table7.pdf", "2026-2_RL_Table_7.pdf", ...), so a new release's table is found without
# a change to this file. Add it here anyway, in release order.
#
# Fields: table (7 or 9), release (as IUCN writes it, "2024-2"), url, archive_url (optional), note
# (optional, why there are two files for one release).

files:
  - { table: 7, release: "2007", url: "https://nc.iucnredlist.org/redlist/content/attachment_files/2007RL_Stats_Table_7.pdf" }
  - { table: 7, release: "2008", url: "https://nc.iucnredlist.org/redlist/content/attachment_files/2008RL_Stats_Table_7.pdf", note: "Genuine changes only" }
  - { table: 7, release: "2009-2", url: "https://nc.iucnredlist.org/redlist/content/attachment_files/2009RL_Stats_Table_7.pdf" }
  - { table: 7, release: "2010-3", url: "http://www.iucnredlist.org/documents/summarystatistics/2010_3RL_Stats_Table_7.pdf", archive_url: "https://web.archive.org/web/2015id_/http://www.iucnredlist.org/documents/summarystatistics/2010_3RL_Stats_Table_7.pdf" }
  - { table: 7, release: "2010-4", url: "https://nc.iucnredlist.org/redlist/content/attachment_files/2010_4RL_Stats_Table_7.pdf" }
